<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Application | JobTrack</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">Job<span>Track</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="applications.html">Applications</a></li>
            </ul>
            <div class="nav-actions">
                <button id="theme-toggle" class="btn-icon">🌙</button>
            </div>
        </div>
    </nav>

    <main class="container main-content">
        <div class="form-container">
            <div class="card">
                <h1 id="form-title">Add Job Application</h1>
                <p class="mb-4">Keep track of where you've applied and stay organized.</p>

                <form id="job-form">
                    <div class="form-group">
                        <label for="company">Company Name*</label>
                        <input type="text" id="company" required placeholder="e.g. Google, Startup Inc.">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="role">Job Role*</label>
                            <input type="text" id="role" required placeholder="e.g. Frontend Developer">
                        </div>
                        <div class="form-group">
                            <label for="location">Location</label>
                            <input type="text" id="location" placeholder="e.g. Remote, New York">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="type">Job Type</label>
                            <select id="type">
                                <option value="full-time">Full-time</option>
                                <option value="part-time">Part-time</option>
                                <option value="contract">Contract</option>
                                <option value="internship">Internship</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="date">Application Date*</label>
                            <input type="date" id="date" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="status">Application Status</label>
                        <select id="status">
                            <option value="applied">Applied</option>
                            <option value="interview">Interview</option>
                            <option value="selected">Selected</option>
                            <option value="rejected">Rejected</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="url">Job URL</label>
                        <input type="url" id="url" placeholder="https://linkedin.com/jobs/...">
                    </div>

                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" rows="4" placeholder="Any specific details, tech stack, or referral info..."></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-outline" onclick="history.back()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Application</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/applications.js"></script>
</body>
</html>
