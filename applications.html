<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Applications | JobTrack</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">Job<span>Track</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="applications.html" class="active">Applications</a></li>
            </ul>
            <div class="nav-actions">
                <button id="theme-toggle" class="btn-icon">🌙</button>
                <a href="add-application.html" class="btn btn-primary">+ Add Job</a>
            </div>
        </div>
    </nav>

    <main class="container main-content">
        <header class="page-header">
            <h1>My Applications</h1>
        </header>

        <!-- Search and Filters -->
        <div class="filters-bar">
            <input type="text" id="search-input" class="form-control" placeholder="Search company or role...">
            
            <select id="filter-status" class="form-control">
                <option value="all">All Statuses</option>
                <option value="applied">Applied</option>
                <option value="interview">Interview</option>
                <option value="selected">Selected</option>
                <option value="rejected">Rejected</option>
            </select>

            <select id="sort-date" class="form-control">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
            </select>
        </div>

        <div class="card overflow-x">
            <table class="table">
                <thead>
                    <tr>
                        <th>Company</th>
                        <th>Role</th>
                        <th>Location</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="applications-list">
                    <!-- JS will inject rows here -->
                </tbody>
            </table>
            <div id="no-results" class="empty-state hidden">
                <p>No matches found for your search.</p>
            </div>
        </div>
    </main>

    <!-- Simple Detail Modal -->
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-company">Company Details</h2>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Details injected here -->
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/applications.js"></script>
</body>
</html>
